version: '3.8'

services:
  gcms-agent:
    build: .
    image: gcms-ai-analyzer:latest
    container_name: gcms-agent
    ports:
      - "8501:8501"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      # Mount your data directory here — edit the left side to your GC-MS data path
      - ./data:/data
      # Output plots and reports persist locally
      - ./output:/app/output
      # Mount additional libraries if needed
      - ./public_libraries:/app/public_libraries
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
